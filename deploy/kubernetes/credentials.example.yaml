# TEMPLATE ONLY: not part of kustomization.yaml, and it contains no real values.
# Create the Secrets out of band (sealed-secrets, external-secrets, or kubectl):
#
#   loomwork token create worker --role worker -f tokens.json -o worker.token
#   loomwork token create ops --role operator -f tokens.json -o ops.token
#   kubectl -n loomwork create secret generic loomwork-tokens --from-file=tokens.json
#   kubectl -n loomwork create secret generic loomwork-worker-token --from-file=token=worker.token
#   kubectl -n loomwork create secret generic loomwork-database \
#       --from-literal=store-url='postgresql://loomwork:<password>@postgres:5432/loomwork'
#
# tokens.json holds only salted hashes; worker.token and ops.token are the credentials.
# Updating loomwork-tokens takes effect on running servers without a restart.
apiVersion: v1
kind: Secret
metadata:
  name: loomwork-database
type: Opaque
stringData:
  store-url: postgresql://loomwork:REPLACE_ME@postgres:5432/loomwork
---
apiVersion: v1
kind: Secret
metadata:
  name: loomwork-tokens
type: Opaque
stringData:
  tokens.json: "[]"
---
apiVersion: v1
kind: Secret
metadata:
  name: loomwork-worker-token
type: Opaque
stringData:
  token: REPLACE_ME
