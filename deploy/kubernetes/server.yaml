# The Loomwork server: stateless, so it scales horizontally over PostgreSQL. Every replica
# also runs the namespace's system worker (timers, outbox, schedules); replicas coordinate
# through row locks, so running several is safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomwork-server
  labels:
    app.kubernetes.io/name: loomwork
    app.kubernetes.io/component: server
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: loomwork
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loomwork
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: ghcr.io/integral0909/loomwork:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["server", "--config", "/etc/loomwork/server.toml"]
          env:
            - name: LOOMWORK_SERVER__NAMESPACES__DEFAULT
              valueFrom:
                secretKeyRef:
                  name: loomwork-database
                  key: store-url
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/loomwork/server.toml
              subPath: server.toml
              readOnly: true
            - name: tokens
              # A directory mount (not subPath) so that Secret updates reach the
              # running server, which reloads the tokens file when it changes.
              mountPath: /etc/loomwork/tokens
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: loomwork-server
        - name: tokens
          secret:
            secretName: loomwork-tokens
            defaultMode: 0400
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loomwork-server
  labels:
    app.kubernetes.io/name: loomwork
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: loomwork
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loomwork-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loomwork
      app.kubernetes.io/component: server
