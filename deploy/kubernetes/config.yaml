# Non-secret configuration. The store URL (with the database password) comes from the
# `loomwork-database` Secret through LOOMWORK_SERVER__NAMESPACES__DEFAULT; see
# secrets.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loomwork-server
  labels:
    app.kubernetes.io/name: loomwork
data:
  server.toml: |
    [server]
    host = "0.0.0.0"
    port = 8080

    [server.auth]
    tokens_file = "/etc/loomwork/tokens/tokens.json"

    [server.limits]
    long_poll_max_seconds = 20
    max_request_body_bytes = 10485760

    [server.cors]
    enabled = false
---
# Only workers and operators inside the namespace may reach the server; the server may
# reach DNS and PostgreSQL. Adjust the database selector to where PostgreSQL runs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loomwork-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loomwork
      app.kubernetes.io/component: server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
---
# Workers need the server and DNS, plus whatever your steps call; this allows all egress
# on HTTPS in addition. Tighten it to your dependencies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loomwork-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loomwork
      app.kubernetes.io/component: worker
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 9464
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loomwork
              app.kubernetes.io/component: server
      ports:
        - port: 8080
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
