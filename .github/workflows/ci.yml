name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Determinism lint of the examples
        run: uv run loomwork lint examples

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loomwork
          POSTGRES_PASSWORD: loomwork
          POSTGRES_DB: loomwork_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loomwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOMWORK_TEST_POSTGRES_DSN: postgresql://loomwork:loomwork@localhost:5432/loomwork_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      - run: uv run coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv export --no-hashes --format requirements-txt > requirements.txt
      - run: uvx pip-audit -r requirements.txt

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  benchmarks:
    name: Benchmarks (quick)
    # Informational only: never gates merges. It only runs on pushes to main (never on
    # pull requests), and continue-on-error keeps a slow or flaky machine from turning
    # the commit red; read the uploaded JSON, don't rely on this job's own status.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --python 3.12
      - run: uv run python -m benchmarks run --quick --store memory,sqlite --out benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: demo
          tags: loomwork-demo:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm loomwork-demo:ci --version
          docker run --rm loomwork-demo:ci cron "0 3 * * *" -n 1
          docker run --rm loomwork-demo:ci store migrate --store sqlite:////tmp/smoke.db
          docker run --rm --entrypoint id loomwork-demo:ci -u | grep -qx 10001
