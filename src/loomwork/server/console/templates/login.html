{% extends "base.html" %}
{% block title %}Sign in -- Loomwork console{% endblock %}
{% block content %}
<form class="login-form" method="post" action="/console/login">
  <h1>Sign in</h1>
  <p class="muted">Paste a Loomwork bearer token. A reader token can view runs and
    schedules; an operator or admin token can also act on them.</p>
  {% if error %}
  <div class="banner banner-error">{{ error }}</div>
  {% endif %}
  <label>
    <span class="field-label">Bearer token</span>
    <input type="password" name="token" autocomplete="off" autofocus required>
  </label>
  <input type="hidden" name="next" value="{{ next_path }}">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
